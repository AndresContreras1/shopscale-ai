# Serves the Angular build and load-balances /api across every API replica.
# Docker's DNS returns one address per replica for "api", and Nginx round-robins between them.
upstream gamestore_api {
    server api:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets have hashed names: cache them for a year.
    location ~* \.(js|css|woff2?|ico|png|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://gamestore_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Nginx is the edge: overwrite (never append) the client address so it cannot be spoofed
        # to bypass the per-IP rate limit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # If a replica is down, retry the request on the next one.
        proxy_next_upstream error timeout http_502 http_503;
        client_max_body_size 10m;
    }

    location /swagger-ui/ { proxy_pass http://gamestore_api; }
    location /v3/api-docs { proxy_pass http://gamestore_api; }

    # Angular routes are resolved in the browser.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
