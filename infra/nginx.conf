# Serves the Angular build and load-balances /api across every API replica.
# Docker's DNS returns one address per replica for "api", and Nginx round-robins between them.

# Do not advertise the version in responses or error pages. It does not stop anyone determined, but
# it takes this host out of the results when somebody scans for a known-vulnerable version.
server_tokens off;

upstream gamestore_api {
    server api:8080;
    keepalive 32;
}

# The addresses allowed to reach the back office. The storefront stays open to everyone; the admin
# host does not. Replace these with the office and the operators' VPN before launch.
geo $admin_allowed {
    default        0;
    10.0.0.0/8     1;
    172.16.0.0/12  1;
    192.168.0.0/16 1;
    127.0.0.1/32   1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The page may only load what this origin serves, and nobody may frame it. That is what makes
    # clickjacking and most injected scripts fail even when something slips past validation.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Static assets have hashed names: cache them for a year.
    location ~* \.(js|css|woff2?|ico|png|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://gamestore_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Nginx is the edge: overwrite (never append) the client address so it cannot be spoofed
        # to bypass the per-IP rate limit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # If a replica is down, retry the request on the next one.
        proxy_next_upstream error timeout http_502 http_503;
        client_max_body_size 10m;
    }

    # Back-office calls are refused from anywhere outside the allow-list, on any host name.
    location /api/admin/ {
        if ($admin_allowed = 0) {
            return 404;
        }
        proxy_pass http://gamestore_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger-ui/ { proxy_pass http://gamestore_api; }
    location /v3/api-docs { proxy_pass http://gamestore_api; }

    # Angular routes are resolved in the browser.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}

# The back office on its own name, so it can be firewalled, put behind a VPN and given a stricter
# cookie policy without touching the storefront. Anyone else gets 404 rather than 403: an address
# that is not on the list learns nothing about what lives here.
server {
    listen 80;
    server_name admin.localhost admin.*;

    root /usr/share/nginx/html;
    index index.html;

    if ($admin_allowed = 0) {
        return 404;
    }

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/ {
        proxy_pass http://gamestore_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
