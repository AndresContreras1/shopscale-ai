# Full stack: Nginx (frontend + load balancer) -> 2 API replicas -> PostgreSQL + Redis.
#   docker compose up --build
#   open http://localhost:8088
# Scale the API horizontally with: docker compose up -d --scale api=4
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gamestore}
      POSTGRES_USER: ${POSTGRES_USER:-gamestore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gamestore}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    deploy:
      replicas: 2
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gamestore}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-gamestore}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-gamestore}
      # Shared state lives outside the API, so any replica can serve any request.
      CACHE_TYPE: redis
      REDIS_HOST: redis
      REDIS_ENABLED: "true"
      RATE_LIMIT_STORE: redis
      # Raise it for load tests, where all traffic comes from one IP.
      RATE_LIMIT_API_PER_MINUTE: ${RATE_LIMIT_API_PER_MINUTE:-300}
      DB_POOL_SIZE: 10
      # Plain HTTP on localhost: browsers still accept a Secure cookie there, but the
      # __Host- prefix is dropped so the demo works behind any local port.
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-SID}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: http://localhost:8088
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      - api

volumes:
  pgdata:
