# Defaults run with an in-memory H2 database so the API starts with zero setup.
# Docker Compose overrides the datasource with PostgreSQL through environment variables.
spring:
  application:
    name: shopscale-api
  autoconfigure:
    # Users come from the database; no generated default password.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:h2:mem:shopscale;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        # Loads lazy collections for a whole page in one query instead of one per row (N+1).
        default_batch_fetch_size: 50
        jdbc:
          batch_size: 50
        order_inserts: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  orders:
    # Unpaid checkouts hold stock for this long, then the reservation is released.
    reservation-ttl: PT15M
    expiry-check-interval: PT1M
  ai:
    # mock | gemini | openai. Without an API key the rule-based writer is used.
    provider: ${AI_PROVIDER:mock}
    timeout: PT30S
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.8-flash}
      base-url: https://generativelanguage.googleapis.com
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      base-url: https://api.openai.com
  security:
    jwt:
      # Override with the JWT_SECRET environment variable in any real deployment.
      secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdefghij}
      ttl: PT2H
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
    rate-limit:
      api-per-minute: 300
      login-per-minute: 10
