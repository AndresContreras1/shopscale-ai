# The schema belongs to the Flyway migrations in db/migration; Hibernate only validates it.
# Defaults point at a local PostgreSQL; Docker Compose overrides them with environment variables.
spring:
  application:
    name: gamestore-api
  threads:
    virtual:
      # Boot 4 on Java 25: each request runs on a virtual thread (JEP 491 removed pinning).
      enabled: true
  autoconfigure:
    # Users come from the database; no generated default password.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  # Local runs cache in memory (Caffeine). Docker Compose switches to Redis so all replicas share one cache.
  cache:
    type: ${CACHE_TYPE:caffeine}
    caffeine:
      spec: maximumSize=500,expireAfterWrite=120s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  datasource:
    url: jdbc:postgresql://localhost:5432/gamestore
    username: gamestore
    password: gamestore
    hikari:
      # Each replica holds its own pool: replicas x pool size must stay below the database connection limit.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  flyway:
    # One versioned file per change, never edited once it has run anywhere.
    locations: classpath:db/migration
    validate-on-migrate: true
  jpa:
    hibernate:
      # The database is migrated by Flyway: Hibernate must find the schema it expects, not create it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Loads lazy collections for a whole page in one query instead of one per row (N+1).
        default_batch_fetch_size: 50
        jdbc:
          batch_size: 50
        order_inserts: true

server:
  port: 8080
  shutdown: graceful

management:
  health:
    redis:
      # Only report Redis health where Redis is actually used.
      enabled: ${REDIS_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  orders:
    # Unpaid checkouts hold stock for this long, then the reservation is released.
    reservation-ttl: PT15M
    expiry-check-interval: PT1M
  ai:
    # mock | gemini | openai. Without an API key the rule-based writer is used.
    provider: ${AI_PROVIDER:mock}
    timeout: PT30S
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.8-flash}
      base-url: https://generativelanguage.googleapis.com
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      base-url: https://api.openai.com
  security:
    jwt:
      # Override with the JWT_SECRET environment variable in any real deployment.
      secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdefghij}
      ttl: PT2H
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
    rate-limit:
      # memory: per instance | redis: shared by every replica
      store: ${RATE_LIMIT_STORE:memory}
      api-per-minute: ${RATE_LIMIT_API_PER_MINUTE:300}
      login-per-minute: ${RATE_LIMIT_LOGIN_PER_MINUTE:10}
