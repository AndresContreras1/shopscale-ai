# Defaults run with an in-memory H2 database so the API starts with zero setup.
# Docker Compose overrides the datasource with PostgreSQL through environment variables.
spring:
  application:
    name: shopscale-api
  datasource:
    url: jdbc:h2:mem:shopscale;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
